<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=LTLZTUNlFQPy&format=png&color=000000">
    <title>Bonfire Radio - बोनफायर नाइट्स</title>
    <!-- Preload ultra-optimized WebP artwork for instant render in milliseconds -->
    <link rel="preload" as="image" href="models/main.webp" type="image/webp" fetchpriority="high">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Special+Elite&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .vintage-font {
            font-family: 'Rozha One', serif;
        }
        .subtitle-font {
            font-family: 'Special Elite', monospace, serif;
        }
        .ui-font {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .retro-shadow {
            text-shadow: 2px 2px 0px rgba(15, 10, 5, 0.85);
        }
        
        @keyframes slideUpFade1 {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUpFade2 {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInSlow {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes playerEntrance {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-title-1 {
            animation: slideUpFade1 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-title-2 {
            opacity: 0;
            animation: slideUpFade2 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }
        .animate-subtitle {
            opacity: 0;
            animation: fadeInSlow 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
        }
        .animate-player {
            animation: playerEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }
        .rotating-art {
            animation: spinSlow 12s linear infinite;
            transform: translateZ(0);
        }
        .paused-art {
            animation-play-state: paused;
        }

        .mac-glass {
            background-color: rgba(22, 16, 14, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.4);
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        @keyframes diceRolling {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(0.85); }
            50% { transform: rotate(180deg) scale(1.15); }
            75% { transform: rotate(270deg) scale(0.85); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .dice-rolling {
            animation: diceRolling 0.55s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite !important;
            color: #fde047 !important;
            filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.8)) !important;
        }

        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            overscroll-behavior: contain;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Enhancement 1: Floating Firefly Particles */
        @keyframes fireflyFloat {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            15% { opacity: 1; }
            50% { transform: translateY(-45vh) translateX(20px) scale(0.6); opacity: 0.7; }
            85% { opacity: 0.3; }
            100% { transform: translateY(-95vh) translateX(-15px) scale(0.2); opacity: 0; }
        }
        .firefly {
            position: absolute;
            bottom: -10px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: radial-gradient(circle, #fbbf24, #f59e0b00);
            box-shadow: 0 0 6px 2px rgba(251, 191, 36, 0.5);
            animation: fireflyFloat linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        /* Enhancement 2: Song Transition Animation */
        @keyframes songSlideIn {
            0% { opacity: 0; transform: translateX(18px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes vinylPulse {
            0% { transform: scale(1); }
            40% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .song-slide-in {
            animation: songSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .vinyl-pulse {
            animation: vinylPulse 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Enhancement 3: Glowing Active Decade Chip */
        .decade-chip-glow {
            box-shadow: 0 0 14px 2px rgba(251, 191, 36, 0.35), inset 0 0 8px rgba(251, 191, 36, 0.08) !important;
            border-color: rgba(251, 191, 36, 0.45) !important;
        }

        /* Enhancement 4: Marquee Scroll for Long Titles */
        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            20% { transform: translateX(0); }
            80% { transform: translateX(var(--marquee-distance)); }
            100% { transform: translateX(var(--marquee-distance)); }
        }
        .marquee-scroll {
            display: inline-block;
            animation: marqueeScroll 6s linear infinite;
            white-space: nowrap;
        }

        /* Enhancement 5: Heart Burst on Like */
        @keyframes heartBurst {
            0% { transform: scale(0) translate(-50%, -50%); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: scale(1.8) translate(-50%, -50%); opacity: 0; }
        }
        .heart-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            pointer-events: none;
            font-size: 10px;
            animation: heartBurst 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Enhancement 6: Draggable Progress Bar Thumb */
        #progressBarContainer {
            touch-action: none;
        }
        #progressBarContainer .progress-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
            cursor: grab;
        }
        #progressBarContainer:hover .progress-thumb,
        #progressBarContainer.scrubbing .progress-thumb {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }

        /* Enhancement 7: Keyboard Shortcut Toast */
        @keyframes toastSlideUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .shortcut-toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            animation: toastSlideUp 5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: none;
        }

        /* Enhancement 8: Bonfire Flicker on Vignette */
        @keyframes bonfireFlicker {
            0%, 100% { opacity: 0.40; }
            30% { opacity: 0.44; }
            50% { opacity: 0.38; }
            70% { opacity: 0.46; }
            90% { opacity: 0.41; }
        }
        .bonfire-flicker {
            animation: bonfireFlicker 4s ease-in-out infinite;
        }

        .active-chip { background: rgba(255,255,255,0.28) !important; }

        #discoverPanel, #discoverResults, #discoverSuggestions, #playlistPanel, #playlistList {
            scrollbar-width: none;     
            -ms-overflow-style: none;    
        }
        #discoverPanel::-webkit-scrollbar,
        #discoverResults::-webkit-scrollbar,
        #discoverSuggestions::-webkit-scrollbar,
        #playlistPanel::-webkit-scrollbar,
        #playlistList::-webkit-scrollbar {
            display: none;              
        }
    </style>
</head>
<body class="m-0 p-0 bg-neutral-950 text-neutral-100 overflow-hidden select-none ui-font h-[100dvh] w-screen">

    <div class="relative w-full h-[100dvh] flex flex-col justify-between items-center overflow-hidden">
        
        <!-- Fullscreen Edge-to-Edge Artwork (Fills 100% of laptop and mobile screens) -->
        <div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none">
            <picture class="w-full h-full block">
                <source srcset="models/main.webp" type="image/webp">
                <img id="mainBgImg" src="models/main.png" alt="Bonfire Scene" class="w-full h-full object-cover object-center pointer-events-none select-none block" fetchpriority="high" loading="eager" decoding="async" />
            </picture>
        </div>

        <!-- Pixel-locked Responsive Hotspot directly on the Diet Coke can -->
        <div id="hiddenDietCoke" class="absolute cursor-pointer z-30"
            style="-webkit-tap-highlight-color: transparent; touch-action: manipulation;"
            title="A cold drink resting on the stand">
        </div>

        <!-- Subtle Atmospheric Vignette with Bonfire Flicker -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/55 pointer-events-none bonfire-flicker"></div>

        <!-- Floating Firefly Particles -->
        <div id="fireflyContainer" class="absolute inset-0 pointer-events-none z-[5] overflow-hidden"></div>

        <!-- Top Navigation Header -->
        <header class="w-full z-40 flex flex-col sm:flex-row items-center justify-between gap-2.5 px-3 sm:px-6 pt-3 sm:pt-6 max-w-7xl">
            
            <!-- Left Action Buttons -->
            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto justify-between sm:justify-start overflow-x-auto no-scrollbar smooth-scroll py-0.5">
                <button id="searchSongBtn" class="mac-glass px-3 sm:px-4 py-1.5 sm:py-2 rounded-full flex items-center gap-1.5 sm:gap-2 text-[11px] sm:text-xs md:text-sm text-white/90 hover:bg-white/20 active:scale-95 transition-all shadow-lg group cursor-pointer flex-shrink-0" title="Add local Hindi mp3s and tag their decade">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white/80 group-hover:text-white transition-colors flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span class="font-medium tracking-wide">Add Songs</span>
                </button>
                <button id="myLikesBtn" class="mac-glass px-3 sm:px-4 py-1.5 sm:py-2 rounded-full flex items-center gap-1.5 sm:gap-2 text-[11px] sm:text-xs md:text-sm text-white/90 hover:bg-white/20 active:scale-95 transition-all shadow-lg group cursor-pointer flex-shrink-0" title="Show my liked songs">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-pink-300 group-hover:text-pink-200 transition-colors flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 21s-6.716-4.35-9.428-8.06C.86 10.42 1.2 6.9 3.9 5.2c2.3-1.44 5.02-.8 6.6 1.16.5.62.9 1.3 1.5 1.94.6-.64 1-1.32 1.5-1.94 1.58-1.96 4.3-2.6 6.6-1.16 2.7 1.7 3.04 5.22 1.33 7.74C18.72 16.65 12 21 12 21z"/>
                    </svg>
                    <span class="font-medium tracking-wide">My Likes</span>
                </button>
                <button id="discoverBtn" class="mac-glass px-3 sm:px-4 py-1.5 sm:py-2 rounded-full flex items-center gap-1.5 sm:gap-2 text-[11px] sm:text-xs md:text-sm text-white/90 hover:bg-white/20 active:scale-95 transition-all shadow-lg group cursor-pointer flex-shrink-0" title="Search & stream full-length songs">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-amber-200 group-hover:text-amber-100 transition-colors flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-2v13M9 19c0 1.1-1.34 2-3 2s-3-.9-3-2 1.34-2 3-2 3 .9 3 2zm12-2c0 1.1-1.34 2-3 2s-3-.9-3-2 1.34-2 3-2 3 .9 3 2zM9 10l12-2"></path>
                    </svg>
                    <span class="font-medium tracking-wide">Search & Play</span>
                </button>
            </div>

            <!-- Right Decade Filter Chips -->
            <div id="decadeFilterBar" class="flex items-center gap-1 sm:gap-1.5 justify-start sm:justify-end w-full sm:w-auto overflow-x-auto no-scrollbar smooth-scroll py-0.5 max-w-full">
                <button data-decade="all" class="decade-chip active-chip mac-glass px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-[11px] md:text-xs font-semibold text-white/90 hover:bg-white/20 active:scale-95 transition-all flex-shrink-0">All</button>
                <button data-decade="50s" class="decade-chip mac-glass px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-[11px] md:text-xs font-semibold text-white/70 hover:bg-white/20 active:scale-95 transition-all flex-shrink-0">50's</button>
                <button data-decade="60s" class="decade-chip mac-glass px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-[11px] md:text-xs font-semibold text-white/70 hover:bg-white/20 active:scale-95 transition-all flex-shrink-0">60's</button>
                <button data-decade="70s" class="decade-chip mac-glass px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-[11px] md:text-xs font-semibold text-white/70 hover:bg-white/20 active:scale-95 transition-all flex-shrink-0">70's</button>
                <button data-decade="80s" class="decade-chip mac-glass px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-[11px] md:text-xs font-semibold text-white/70 hover:bg-white/20 active:scale-95 transition-all flex-shrink-0">80's</button>
                <button data-decade="90s" class="decade-chip mac-glass px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-[11px] md:text-xs font-semibold text-white/70 hover:bg-white/20 active:scale-95 transition-all flex-shrink-0">90's</button>
                <button data-decade="20s" class="decade-chip mac-glass px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-[11px] md:text-xs font-semibold text-white/70 hover:bg-white/20 active:scale-95 transition-all flex-shrink-0">2020's</button>
            </div>

        </header>

        <!-- Discover Panel (Modal / Dropdown) -->
        <div id="discoverPanel" class="hidden fixed sm:absolute inset-x-3 top-24 sm:inset-auto sm:top-20 sm:left-6 z-50 mac-glass rounded-2xl w-auto sm:w-[320px] p-3 flex-col shadow-2xl" style="max-height: calc(100dvh - 180px);">
            <div class="flex items-center justify-between mb-2 px-1 flex-shrink-0">
                <h3 class="text-xs font-bold text-white/90 tracking-wide uppercase">Search &amp; Play</h3>
                <button id="closeDiscoverPanel" class="text-white/60 hover:text-white text-base leading-none p-1">✕</button>
            </div>

            <div class="px-1 mb-2 flex-shrink-0" id="discoverSearchWrap">
                <div class="flex items-center gap-2 bg-white/10 border border-white/20 rounded-xl px-3 py-2 focus-within:border-white/50 transition-colors">
                    <svg class="w-3.5 h-3.5 text-white/50 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input id="discoverInput" type="text" autocomplete="off" spellcheck="false"
                        placeholder="Song, artist, movie…"
                        class="flex-grow bg-transparent text-xs text-white outline-none placeholder-white/40 min-w-0" />
                    <button id="discoverClear" class="hidden text-white/40 hover:text-white text-sm leading-none flex-shrink-0">✕</button>
                </div>
            </div>

            <ul id="discoverSuggestions" class="hidden flex-col gap-0.5 overflow-y-auto smooth-scroll px-1 flex-shrink-0" style="max-height:220px;"></ul>

            <div id="discoverStatus" class="hidden flex-shrink-0 text-white/50 text-xs text-center py-2 px-1"></div>

            <ul id="discoverResults" class="flex flex-col gap-0.5 overflow-y-auto smooth-scroll flex-1 px-1"></ul>
        </div>

        <!-- Playlist / Favorites Panel -->
        <div id="playlistPanel" class="hidden fixed sm:absolute inset-x-3 top-24 sm:inset-auto sm:top-20 sm:right-6 z-50 mac-glass rounded-2xl w-auto sm:w-[280px] max-h-[60vh] overflow-y-auto smooth-scroll p-3 shadow-2xl">
            <div class="flex items-center justify-between mb-2 px-1">
                <h3 id="playlistPanelTitle" class="text-xs font-bold text-white/90 tracking-wide uppercase">Playlist</h3>
                <button id="closePlaylistPanel" class="text-white/60 hover:text-white text-base leading-none p-1">✕</button>
            </div>
            <ul id="playlistList" class="flex flex-col gap-1 smooth-scroll"></ul>
            <p id="playlistEmptyMsg" class="text-white/50 text-xs text-center py-4 hidden">No songs yet.</p>
        </div>

        <!-- Tag Modal -->
        <div id="tagModalOverlay" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center px-4">
            <div class="mac-glass rounded-2xl p-5 w-full max-w-sm">
                <h3 class="text-sm font-bold text-white mb-1">Tag these songs</h3>
                <p class="text-xs text-white/60 mb-3">Pick the decade for the file(s) you just added.</p>
                <select id="tagDecadeSelect" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-sm text-white mb-4 outline-none">
                    <option value="50s">50's</option>
                    <option value="60s">60's</option>
                    <option value="70s">70's</option>
                    <option value="80s">80's</option>
                    <option value="90s">90's</option>
                    <option value="20s">2020's</option>
                </select>
                <div class="flex gap-2">
                    <button id="tagConfirmBtn" class="flex-1 bg-white text-[#b34721] font-semibold text-sm rounded-lg py-2 hover:opacity-90 active:scale-95 transition-all">Add to Playlist</button>
                    <button id="tagCancelBtn" class="px-4 bg-white/10 text-white text-sm rounded-lg py-2 hover:bg-white/20 active:scale-95 transition-all">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Center Hero Title -->
        <div class="relative z-10 text-center flex flex-col items-center max-w-4xl mx-auto my-auto py-2 sm:py-6 select-none pointer-events-none">
            <h1 class="vintage-font text-4xl sm:text-6xl md:text-8xl lg:text-[130px] tracking-tight text-[#FDF6E2] retro-shadow animate-title-1 leading-none mb-[-10px] sm:mb-[-18px] md:mb-[-35px]">
                बोनफायर
            </h1>
            <h1 class="vintage-font text-4xl sm:text-6xl md:text-8xl lg:text-[130px] tracking-tight text-[#FDF6E2] retro-shadow animate-title-2 leading-none mb-2 sm:mb-3 md:mb-5">
                नाइट्स
            </h1>
            <div class="subtitle-font text-xs sm:text-base md:text-xl tracking-[0.18em] sm:tracking-[0.2em] text-[#EAD8B1] opacity-95 animate-subtitle font-bold uppercase drop-shadow-lg">
                — 50’s TO 20’s —
            </div>
        </div>

        <!-- Bottom Audio Player Container -->
        <div class="w-full max-w-2xl z-30 pb-3 sm:pb-6 md:pb-8 px-2 sm:px-4 flex items-center justify-center gap-1.5 sm:gap-3 opacity-0 animate-player">

            <div class="flex-1 min-w-0 h-[74px] sm:h-[82px] md:h-[88px]">

                <audio id="audioElement"></audio>

                <div class="mac-glass rounded-2xl sm:rounded-3xl h-full px-2.5 sm:px-4 md:px-5 flex items-center justify-between gap-2 sm:gap-3 md:gap-4 text-neutral-100 relative overflow-hidden">
                 
                    <div class="absolute inset-0 bg-[#b34721] mix-blend-multiply opacity-10 pointer-events-none"></div>
                    <div class="absolute inset-0 paper-grain opacity-30 pointer-events-none"></div>

                    <!-- Album Art Vinyl -->
                    <div class="relative flex-shrink-0 cursor-pointer group shadow-lg rounded-full" id="uploadTrigger" title="Click to add local music files">
                        <div class="w-11 h-11 sm:w-13 sm:h-13 md:w-16 md:h-16 rounded-full overflow-hidden border-2 border-white/20 transition-transform group-hover:scale-105">
                            <img id="albumArt" src="models/main.webp" alt="Artwork" class="w-full h-full object-cover rotating-art paused-art" onerror="this.onerror=null;this.src='models/main.webp';" />
                        </div>
                        <div class="absolute inset-0 bg-black/60 rounded-full flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-white/80 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            <span class="text-[8px] sm:text-[9px] text-white font-medium">MUSIC</span>
                        </div>
                    </div>

                    <input type="file" id="audioFileInput" accept="audio/*" multiple class="hidden">

                    <!-- Track Info & Scrubber -->
                    <div class="flex-grow min-w-0 flex flex-col justify-center gap-1 sm:gap-2 py-0.5">
                        <div class="truncate text-center">
                            <h2 id="songTitle" class="text-xs sm:text-sm md:text-base font-semibold text-white truncate drop-shadow-sm">Waiting for input...</h2>
                            <p id="artistName" class="text-[10px] sm:text-xs text-white/70 font-medium truncate">Add music to start</p>
                        </div>

                        <div class="flex items-center gap-1.5 sm:gap-2 w-full">
                            <span id="currentTime" class="text-[9px] sm:text-[11px] font-mono text-white/60 w-7 sm:w-10 text-right">00:00</span>
                          
                            <div class="flex-grow bg-white/20 h-1.5 rounded-full overflow-visible cursor-pointer group relative" id="progressBarContainer">
                                <div id="progressBar" class="bg-white h-full w-0 rounded-full relative transition-all duration-75 ease-linear shadow-md">
                                    <div class="progress-thumb"></div>
                                </div>
                            </div>
                            <span id="duration" class="text-[9px] sm:text-[11px] font-mono text-white/60 w-7 sm:w-10 text-left">00:00</span>
                        </div>
                    </div>

                    <!-- Transport Controls -->
                    <div class="flex items-center gap-0.5 sm:gap-1 md:gap-2 flex-shrink-0">

                        <button id="likeBtn" class="w-7 h-7 sm:w-8 sm:h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center hover:bg-white/10 text-white/70 transition-all active:scale-95 disabled:opacity-40" title="Like this song" disabled>
                            <svg id="likeIcon" class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-6.716-4.35-9.428-8.06C.86 10.42 1.2 6.9 3.9 5.2c2.3-1.44 5.02-.8 6.6 1.16.5.62.9 1.3 1.5 1.94.6-.64 1-1.32 1.5-1.94 1.58-1.96 4.3-2.6 6.6-1.16 2.7 1.7 3.04 5.22 1.33 7.74C18.72 16.65 12 21 12 21z"/>
                            </svg>
                        </button>

                        <button id="prevBtn" class="w-7 h-7 sm:w-8 sm:h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center hover:bg-white/10 text-white/70 transition-all active:scale-95 disabled:opacity-40" title="Previous Song">
                            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>

                        <button id="playPauseBtn" class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 rounded-full bg-white text-[#b34721] flex items-center justify-center shadow-xl hover:scale-105 active:scale-95 transition-all disabled:opacity-60 flex-shrink-0" title="Play / Pause">
                            <svg id="playIcon" class="w-5 h-5 sm:w-6 sm:h-6 fill-current" viewBox="0 0 24 24"><path d="M9.5 5.5v13l10-6.5z"/></svg>
                            <svg id="pauseIcon" class="w-4 h-4 sm:w-5 sm:h-5 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>

                        <button id="nextBtn" class="w-7 h-7 sm:w-8 sm:h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center hover:bg-white/10 text-white/70 transition-all active:scale-95 disabled:opacity-40" title="Next Song">
                            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>

                    </div>

                </div>
            </div>

            <!-- Dice Button -->
            <button id="playerPlaylistBtn" class="mac-glass cursor-pointer flex-shrink-0 h-[74px] w-[74px] sm:h-[82px] sm:w-[82px] md:h-[88px] md:w-[88px] rounded-2xl sm:rounded-3xl flex items-center justify-center text-white/80 hover:text-white hover:bg-white/20 active:scale-95 transition-all shadow-lg group" title="Discover Random Song (Click or press Enter)">
                <svg id="diceIcon" class="w-5 h-5 sm:w-6 sm:h-6 md:w-7 md:h-7 transition-transform group-hover:rotate-12 duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
                    <circle cx="8"  cy="8"  r="1.1" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="8"  r="1.1" fill="currentColor" stroke="none"/>
                    <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
                    <circle cx="8"  cy="16" r="1.1" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="16" r="1.1" fill="currentColor" stroke="none"/>
                </svg>
            </button>

        </div>

    </div>

    <script>
        const audioElement = document.getElementById('audioElement');
        audioElement.preload = 'auto';
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const likeBtn = document.getElementById('likeBtn');
        const likeIcon = document.getElementById('likeIcon');
        const songTitleEl = document.getElementById('songTitle');
        const artistNameEl = document.getElementById('artistName');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const progressBar = document.getElementById('progressBar');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const albumArt = document.getElementById('albumArt');
        const uploadTrigger = document.getElementById('uploadTrigger');
        const audioFileInput = document.getElementById('audioFileInput');
        const searchSongBtn = document.getElementById('searchSongBtn');
        const myLikesBtn = document.getElementById('myLikesBtn');
        const decadeFilterBar = document.getElementById('decadeFilterBar');
        const decadeChips = document.querySelectorAll('.decade-chip');
        const playlistPanel = document.getElementById('playlistPanel');
        const playlistPanelTitle = document.getElementById('playlistPanelTitle');
        const playlistList = document.getElementById('playlistList');
        const playlistEmptyMsg = document.getElementById('playlistEmptyMsg');
        const closePlaylistPanel = document.getElementById('closePlaylistPanel');
        const tagModalOverlay = document.getElementById('tagModalOverlay');
        const tagDecadeSelect = document.getElementById('tagDecadeSelect');
        const tagConfirmBtn = document.getElementById('tagConfirmBtn');
        const tagCancelBtn = document.getElementById('tagCancelBtn');
        const playerPlaylistBtn = document.getElementById('playerPlaylistBtn');
        const discoverBtn = document.getElementById('discoverBtn');
        const discoverPanel = document.getElementById('discoverPanel');
        const closeDiscoverPanel = document.getElementById('closeDiscoverPanel');
        const discoverInput = document.getElementById('discoverInput');
        const discoverStatus = document.getElementById('discoverStatus');
        const discoverResults = document.getElementById('discoverResults');

        const DECADE_LABELS = { '50s': "50's", '60s': "60's", '70s': "70's", '80s': "80's", '90s': "90's", '20s': "2020's" };

 
        let library = [];
        let filteredView = []; 
        let currentLibIndex = null; 
        let isPlaying = false;
        let activeDecadeFilter = 'all';
        let pendingFiles = [];

        const LIKES_KEY = 'bonfireRadioLikedSongIds';    
        const LIKED_PREVIEWS_KEY = 'bonfireRadioLikedPreviews'; 

        function loadLikedIds() {
            try { return new Set(JSON.parse(localStorage.getItem(LIKES_KEY)) || []); }
            catch (e) { return new Set(); }
        }
        function saveLikedIds(setObj) {
            localStorage.setItem(LIKES_KEY, JSON.stringify(Array.from(setObj)));
        }
        let likedIds = loadLikedIds();

        function loadLikedPreviews() {
            try { return JSON.parse(localStorage.getItem(LIKED_PREVIEWS_KEY)) || []; }
            catch (e) { return []; }
        }
        function saveLikedPreviews(arr) {
            localStorage.setItem(LIKED_PREVIEWS_KEY, JSON.stringify(arr));
        }
        let likedPreviews = loadLikedPreviews(); 

        function songId(name, decade) {
            return decade + '::' + name;
        }

        function setInitialState() {
            songTitleEl.textContent = "Waiting for input...";
            artistNameEl.textContent = "Add music to start";
            currentTimeEl.textContent = "00:00";
            durationEl.textContent = "00:00";
            progressBar.style.width = "0%";
            playPauseBtn.disabled = true;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            likeBtn.disabled = true;
        }
        setInitialState();

        uploadTrigger.addEventListener('click', () => audioFileInput.click());
        searchSongBtn.addEventListener('click', () => audioFileInput.click());

        audioFileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
            if (files.length === 0) return;
            pendingFiles = files;
            tagModalOverlay.classList.remove('hidden');
            audioFileInput.value = '';
        });

        tagCancelBtn.addEventListener('click', () => {
            pendingFiles = [];
            tagModalOverlay.classList.add('hidden');
        });

        tagConfirmBtn.addEventListener('click', () => {
            const decade = tagDecadeSelect.value;
            const startIndex = library.length;
            pendingFiles.forEach(file => {
                let displayName = file.name.replace(/\.[^/.]+$/, "");
                let artist = "Unknown Artist";
                let title = displayName;
                if (displayName.includes(' - ')) {
                    let parts = displayName.split(' - ');
                    artist = parts[0].trim();
                    title = parts[1].trim();
                }
                const id = songId(file.name, decade);
                library.push({
                    id, name: file.name, artist, title, decade,
                    file, liked: likedIds.has(id)
                });
            });
            pendingFiles = [];
            tagModalOverlay.classList.add('hidden');
            applyFilter(activeDecadeFilter);
            if (currentLibIndex === null && library.length > startIndex) {
                playFromLibrary(startIndex);
            }
            renderPlaylistPanel();
        });

        function initFireflies() {
            const container = document.getElementById('fireflyContainer');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const f = document.createElement('div');
                f.className = 'firefly';
                f.style.left = `${Math.random() * 96 + 2}%`;
                f.style.animationDuration = `${6 + Math.random() * 8}s`;
                f.style.animationDelay = `${Math.random() * 5}s`;
                f.style.opacity = `${0.35 + Math.random() * 0.55}`;
                const size = 2 + Math.random() * 2.5;
                f.style.width = `${size}px`;
                f.style.height = `${size}px`;
                container.appendChild(f);
            }
        }
        initFireflies();

        function updateDecadeChipStyles() {
            decadeChips.forEach(c => {
                const isActive = c.dataset.decade === activeDecadeFilter;
                c.classList.toggle('active-chip', isActive);
                c.classList.toggle('decade-chip-glow', isActive);
                c.classList.toggle('text-white/95', isActive);
                c.classList.toggle('text-white/70', !isActive);
                c.style.background = isActive ? 'rgba(255,255,255,0.28)' : '';
            });
        }

        decadeChips.forEach(chip => {
            chip.addEventListener('click', () => {
                activeDecadeFilter = chip.dataset.decade;
                updateDecadeChipStyles();
                applyFilter(activeDecadeFilter);
                renderPlaylistPanel();
                preloadedDiceSong = null;
                preloadNextDiceSong(activeDecadeFilter);
            });
        });
        updateDecadeChipStyles();

        function applyFilter(decade) {
            if (decade === 'all') {
                filteredView = library.map((_, i) => i);
            } else {
                filteredView = library.reduce((acc, song, i) => {
                    if (song.decade === decade) acc.push(i);
                    return acc;
                }, []);
            }
        }
        applyFilter('all');

        myLikesBtn.addEventListener('click', () => {
            showLikesPanel();
        });
        closePlaylistPanel.addEventListener('click', () => playlistPanel.classList.add('hidden'));

        const FALLBACK_SONGS = {
            "50s": [{"query":"awaara hoon mukesh"},{"query":"mera joota hai japani mukesh"},{"query":"pyar hua iqrar hua shree 420"},{"query":"aaja re pardesi lata mangeshkar"},{"query":"chaudhvin ka chand ho rafi"},{"query":"yeh raat bheegi bheegi lata manna dey"}],
            "60s": [{"query":"lag jaa gale lata mangeshkar"},{"query":"roop tera mastana kishore kumar"},{"query":"mere sapno ki rani kishore kumar"},{"query":"ehsaan tera hoga mujh par rafi"},{"query":"ye sham mastani kishore kumar"},{"query":"baharon phool barsao rafi"}],
            "70s": [{"query":"pal pal dil ke paas kishore kumar"},{"query":"kabhi kabhie mere dil mein mukesh"},{"query":"chura liya hai tumne jo dil ko"},{"query":"kheench teer kaman"},{"query":"dum maro dum asha bhosle"},{"query":"kya hua tera wada rafi"}],
            "80s": [{"query":"dil cheez kya hai asha bhosle"},{"query":"yaad aa raha hai bappi lahiri"},{"query":"hawa hawai kavita krishnamurthy"},{"query":"gazab ka hai din udit narayan"},{"query":"papa kehte hain udit narayan"},{"query":"chehra kya dekhte ho"}],
            "90s": [{"query":"tujhe dekha to kumar sanu"},{"query":"pehla nasha udit narayan"},{"query":"chaiyya chaiyya sukhwinder singh"},{"query":"sandese aate hain roop kumar"},{"query":"chura ke dil mera kumar sanu"},{"query":"dil to pagal hai lata udit"}],
            "20s": [{"query":"tum hi ho arijit singh"},{"query":"kesariya arijit singh"},{"query":"kalank arijit singh"},{"query":"shayad arijit singh"},{"query":"channa mereya arijit singh"},{"query":"raataan lambiyan jubin nautiyal"}]
        };

        let songsDb = null; 

        async function loadSongsDb() {
            if (songsDb) return songsDb;
            try {
                const res = await fetch('songs.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                songsDb = await res.json();
            } catch (e) {
                console.warn('Using fallback songs catalog:', e);
                songsDb = FALLBACK_SONGS;
            }
            return songsDb || FALLBACK_SONGS;
        }

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        async function fetchFullSongs(query) {
            const q = (query || '').trim();
            if (!q) return [];

            // 1. Primary: Vercel Serverless Function (/api/search?q=...)
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.results && data.results.length > 0) {
                        return data.results.map(s => ({
                            id: s.id,
                            title: s.title,
                            artist: s.artist,
                            album: s.album,
                            decade: s.decade || '20s',
                            artwork: s.artwork,
                            previewUrl: s.streamUrl,
                            duration: s.duration,
                            isFullSong: true,
                            liked: likedPreviews.some(lp => lp.id === s.id)
                        }));
                    }
                }
            } catch (_) {}

            // 2. High-speed Fallback: iTunes Audio
            try {
                const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q + ' hindi')}&media=music&country=IN&limit=6`;
                const res = await fetch(url);
                const data = await res.json();
                const tracks = (data.results || []).filter(t => t.previewUrl);
                if (tracks.length > 0) {
                    return tracks.map(t => ({
                        id: 'itunes-' + t.trackId,
                        title: t.trackName,
                        artist: t.artistName,
                        decade: guessDecade(t.releaseDate),
                        artwork: t.artworkUrl100,
                        previewUrl: t.previewUrl,
                        duration: 30,
                        isFullSong: false,
                        liked: likedPreviews.some(s => s.id === 'itunes-' + t.trackId)
                    }));
                }
            } catch (_) {}

            return [];
        }

        const diceIcon = document.getElementById('diceIcon');

        let diceHistory = [];     
        let diceHistoryPos = -1;
        let preloadedDiceSong = null;
        let isPreloading = false;

        async function preloadNextDiceSong(decade) {
            if (isPreloading) return;
            isPreloading = true;
            try {
                const db = await loadSongsDb();
                if (!db) return;
                const targetDecade = decade || activeDecadeFilter;
                let pool = (targetDecade === 'all') ? Object.values(db).flat() : (db[targetDecade] || []);
                if (!pool.length) return;
                const entry = pickRandom(pool);
                const songs = await fetchFullSongs(entry.query);
                if (songs && songs.length > 0) {
                    const song = pickRandom(songs);
                    if (targetDecade !== 'all') song.decade = targetDecade;
                    preloadedDiceSong = song;
                }
            } catch (_) {}
            finally { isPreloading = false; }
        }

        // Start preloading initial song in background
        setTimeout(() => preloadNextDiceSong(), 800);

        async function playRandomDiceSong() {
            if (diceIcon) diceIcon.classList.add('dice-rolling');
            playerPlaylistBtn.disabled = true;
            prevBtn.disabled = true;
            nextBtn.disabled = true;

            const decadeLabel = DECADE_LABELS[activeDecadeFilter] || 'All Decades';

            // 1. Instant Playback from Preloaded Cache (0ms latency)
            if (preloadedDiceSong && (activeDecadeFilter === 'all' || preloadedDiceSong.decade === activeDecadeFilter)) {
                const song = preloadedDiceSong;
                preloadedDiceSong = null;
                diceHistory = diceHistory.slice(0, diceHistoryPos + 1);
                diceHistory.push(song);
                diceHistoryPos = diceHistory.length - 1;
                currentPreviewList = [song];
                playPreviewSong(song, 0);

                setTimeout(() => {
                    if (diceIcon) diceIcon.classList.remove('dice-rolling');
                    playerPlaylistBtn.disabled = false;
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    preloadNextDiceSong();
                }, 400);
                return;
            }

            // 2. Direct fast fetch of 1 candidate
            songTitleEl.textContent = '🎲 Rolling the dice…';
            artistNameEl.textContent = `Finding a classic from ${decadeLabel}`;

            try {
                const db = await loadSongsDb();
                if (!db) throw new Error('Could not load songs database');

                let pool = (activeDecadeFilter === 'all') ? Object.values(db).flat() : (db[activeDecadeFilter] || []);
                if (!pool.length) throw new Error('No songs found for this decade');

                const entry = pickRandom(pool);
                let songs = await fetchFullSongs(entry.query);

                if (!songs || !songs.length) {
                    const fallbackQuery = activeDecadeFilter === '50s' ? 'awaara hoon' :
                                         activeDecadeFilter === '60s' ? 'lag ja gale' :
                                         activeDecadeFilter === '70s' ? 'chura liya hai' :
                                         activeDecadeFilter === '80s' ? 'dil cheez kya' :
                                         activeDecadeFilter === '90s' ? 'pehla nasha' : 'kesariya';
                    songs = await fetchFullSongs(fallbackQuery);
                }

                if (!songs || !songs.length) throw new Error('Could not tune in — tap Dice again');

                const song = pickRandom(songs);
                if (activeDecadeFilter !== 'all') song.decade = activeDecadeFilter;

                diceHistory = diceHistory.slice(0, diceHistoryPos + 1);
                diceHistory.push(song);
                diceHistoryPos = diceHistory.length - 1;

                currentPreviewList = [song];
                playPreviewSong(song, 0);

                // Queue next track in background
                preloadNextDiceSong();

            } catch (err) {
                songTitleEl.textContent = '🎲 ' + (err.message || 'Could not pick a song');
                artistNameEl.textContent = 'Tap the dice again or switch decade';
            } finally {
                if (diceIcon) diceIcon.classList.remove('dice-rolling');
                playerPlaylistBtn.disabled = false;
                prevBtn.disabled = false;
                nextBtn.disabled = false;
            }
        }

        playerPlaylistBtn.addEventListener('click', () => playRandomDiceSong());

        function showLikesPanel() {
            playlistPanelTitle.textContent = 'My Likes ♥';
            playlistPanel.classList.remove('hidden');
            playlistPanel.dataset.mode = 'likes';
            renderPlaylistPanel();
        }

        function renderPlaylistPanel() {
            if (playlistPanel.classList.contains('hidden')) return;
            const mode = playlistPanel.dataset.mode || 'browse';
            playlistList.innerHTML = '';

            if (mode === 'likes') {
                playlistPanelTitle.textContent = 'My Likes ♥';
                const likedLocal = library.filter(s => s.liked);
                const combined = [
                    ...likedLocal.map(s => ({ kind: 'local', song: s })),
                    ...likedPreviews.map(s => ({ kind: 'preview', song: s }))
                ];
                if (combined.length === 0) {
                    playlistEmptyMsg.classList.remove('hidden');
                    playlistEmptyMsg.textContent = "No liked songs yet. Tap the heart while a song plays.";
                    return;
                }
                playlistEmptyMsg.classList.add('hidden');
                combined.forEach(entry => {
                    const song = entry.song;
                    const isCurrent = currentSong && currentSong.id === song.id;
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between gap-2 px-2 py-2 rounded-lg hover:bg-white/10 cursor-pointer transition-all ' + (isCurrent ? 'bg-white/15' : '');
                    const badge = entry.kind === 'preview' ? ' · Full Song' : '';
                    li.innerHTML = `
                        <div class="min-w-0 flex-1">
                            <p class="text-xs font-semibold text-white truncate">${escapeHtml(song.title)}</p>
                            <p class="text-[10px] text-white/60 truncate">${escapeHtml(song.artist)} · ${DECADE_LABELS[song.decade]}${badge}</p>
                        </div>
                        <span class="like-dot text-pink-300 text-xs flex-shrink-0">♥</span>
                    `;
                    if (entry.kind === 'preview') {
                        li.addEventListener('click', () => playPreviewSong(song));
                    } else {
                        const libIdx = library.indexOf(song);
                        if (!song.file) {
                            li.classList.add('opacity-50');
                            li.title = 'Re-add this file this session to play it';
                        }
                        li.addEventListener('click', () => { if (song.file) playFromLibrary(libIdx); });
                    }
                    playlistList.appendChild(li);
                });
                return;
            }

            const indices = filteredView;
            if (indices.length === 0) {
                playlistEmptyMsg.classList.remove('hidden');
                playlistEmptyMsg.textContent = "No songs in this decade yet. Use Add Songs.";
                return;
            }
            playlistEmptyMsg.classList.add('hidden');
            indices.forEach(i => {
                const song = library[i];
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between gap-2 px-2 py-2 rounded-lg hover:bg-white/10 cursor-pointer transition-all ' + (i === currentLibIndex ? 'bg-white/15' : '');
                li.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <p class="text-xs font-semibold text-white truncate">${escapeHtml(song.title)}</p>
                        <p class="text-[10px] text-white/60 truncate">${escapeHtml(song.artist)} · ${DECADE_LABELS[song.decade]}</p>
                    </div>
                    <span class="like-dot text-pink-300 text-xs flex-shrink-0">${song.liked ? '♥' : ''}</span>
                `;
                li.addEventListener('click', () => {
                    if (!song.file) return;
                    playFromLibrary(i);
                });
                if (!song.file) {
                    li.classList.add('opacity-50');
                    li.title = 'Re-add this file this session to play it';
                }
                playlistList.appendChild(li);
            });
        }

        const discoverClear      = document.getElementById('discoverClear');
        const discoverSuggestions = document.getElementById('discoverSuggestions');

        discoverBtn.addEventListener('click', () => {
            const isHidden = discoverPanel.classList.contains('hidden');
            if (isHidden) {
                discoverPanel.classList.remove('hidden');
                discoverPanel.style.display = 'flex';
                setTimeout(() => discoverInput.focus(), 50);
            } else {
                discoverPanel.classList.add('hidden');
                discoverPanel.style.display = '';
                hideSuggestions();
            }
        });
        closeDiscoverPanel.addEventListener('click', () => {
            discoverPanel.classList.add('hidden');
            discoverPanel.style.display = '';
            hideSuggestions();
        });

        function guessDecade(releaseDate) {
            if (!releaseDate) return '20s';
            const year = parseInt(releaseDate.slice(0, 4), 10);
            if (year < 1960) return '50s';
            if (year < 1970) return '60s';
            if (year < 1980) return '70s';
            if (year < 1990) return '80s';
            if (year < 2000) return '90s';
            return '20s';
        }

        function highlightMatch(text, query) {
            if (!query) return escapeHtml(text);
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return escapeHtml(text);
            return escapeHtml(text.slice(0, idx))
                + `<mark class="bg-white/25 text-white rounded px-0.5">${escapeHtml(text.slice(idx, idx + query.length))}</mark>`
                + escapeHtml(text.slice(idx + query.length));
        }

        let suggestToken = 0;
        let suggestTimer = null;
        let suggestionItems = [];
        let suggestionFocus = -1;

        function hideSuggestions() {
            discoverSuggestions.classList.add('hidden');
            discoverSuggestions.classList.remove('flex');
            discoverSuggestions.innerHTML = '';
            suggestionItems = [];
            suggestionFocus = -1;
            discoverResults.style.display = '';
            discoverStatus.style.display = '';
        }

        async function fetchSuggestions(q) {
            const myToken = ++suggestToken;
            if (q.length < 2) { hideSuggestions(); return; }

            try {
                const songs = await fetchFullSongs(q);
                if (myToken !== suggestToken) return;
                if (!songs.length) { hideSuggestions(); return; }

                discoverSuggestions.innerHTML = '';
                suggestionItems = [];
                suggestionFocus = -1;

                songs.slice(0, 6).forEach((song) => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center gap-2 px-2 py-2 rounded-lg cursor-pointer hover:bg-white/10 transition-colors';
                    li.innerHTML = `
                        <img src="${song.artwork || 'models/main.png'}" class="w-8 h-8 rounded-md flex-shrink-0 object-cover"/>
                        <div class="min-w-0 flex-1">
                            <p class="text-[11px] font-semibold text-white truncate">${highlightMatch(song.title, q)}</p>
                            <p class="text-[10px] text-white/55 truncate">${highlightMatch(song.artist, q)}</p>
                        </div>
                        <svg class="w-3 h-3 text-white/30 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M9.5 5.5v13l10-6.5z"/></svg>
                    `;
                    li.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        discoverInput.value = song.title + ' — ' + song.artist;
                        discoverClear.classList.remove('hidden');
                        hideSuggestions();
                        playPreviewSong(song, 0);
                    });
                    discoverSuggestions.appendChild(li);
                    suggestionItems.push(li);
                });

                discoverResults.style.display = 'none';
                discoverStatus.style.display = 'none';
                discoverSuggestions.classList.remove('hidden');
                discoverSuggestions.classList.add('flex');

            } catch (_) { hideSuggestions(); }
        }

        discoverInput.addEventListener('keydown', (e) => {
            if (discoverSuggestions.classList.contains('hidden')) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                suggestionFocus = Math.min(suggestionFocus + 1, suggestionItems.length - 1);
                updateSuggestionFocus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                suggestionFocus = Math.max(suggestionFocus - 1, -1);
                updateSuggestionFocus();
            } else if (e.key === 'Enter' && suggestionFocus >= 0) {
                e.preventDefault();
                suggestionItems[suggestionFocus].dispatchEvent(new MouseEvent('mousedown'));
            } else if (e.key === 'Escape') {
                hideSuggestions();
            }
        });

        function updateSuggestionFocus() {
            suggestionItems.forEach((li, i) => {
                li.classList.toggle('bg-white/15', i === suggestionFocus);
            });
            if (suggestionFocus >= 0) suggestionItems[suggestionFocus].scrollIntoView({ block: 'nearest' });
        }

        document.addEventListener('click', (e) => {
            if (!discoverPanel.contains(e.target)) hideSuggestions();
        });

        discoverClear.addEventListener('click', () => {
            discoverInput.value = '';
            discoverClear.classList.add('hidden');
            discoverResults.innerHTML = '';
            discoverStatus.classList.add('hidden');
            hideSuggestions();
            discoverInput.focus();
        });

        let discoverSearchToken = 0;
        let discoverDebounceTimer = null;

        discoverInput.addEventListener('input', () => {
            const val = discoverInput.value;
            discoverClear.classList.toggle('hidden', !val);

            clearTimeout(suggestTimer);
            suggestTimer = setTimeout(() => fetchSuggestions(val.trim()), 200);

            clearTimeout(discoverDebounceTimer);
            discoverDebounceTimer = setTimeout(() => runDiscoverSearch(val), 450);
        });

        async function runDiscoverSearch(rawQuery, autoplaySong) {
            const q = rawQuery.trim();
            const myToken = ++discoverSearchToken;

            if (!q) {
                discoverResults.innerHTML = '';
                discoverStatus.classList.add('hidden');
                return;
            }
            if (q.length < 2) {
                discoverStatus.classList.remove('hidden');
                discoverStatus.textContent = 'Keep typing…';
                discoverResults.innerHTML = '';
                return;
            }

            discoverStatus.classList.remove('hidden');
            discoverStatus.innerHTML = `<span class="inline-flex items-center gap-1"><svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg> Searching full tracks…</span>`;

            try {
                const songList = await fetchFullSongs(q);
                if (myToken !== discoverSearchToken) return;

                discoverResults.innerHTML = '';

                if (!songList.length) {
                    discoverStatus.classList.remove('hidden');
                    discoverStatus.textContent = 'No results found. Try a different song name.';
                    return;
                }
                discoverStatus.classList.add('hidden');
                currentPreviewList = songList;

                if (autoplaySong) {
                    const idx = songList.findIndex(s => s.id === autoplaySong.id);
                    playPreviewSong(autoplaySong, idx >= 0 ? idx : 0);
                }

                songList.forEach((song, idx) => {
                    const isCurrent = currentSong && currentSong.id === song.id;
                    const li = document.createElement('li');
                    li.className = `flex items-center gap-2 px-2 py-2 rounded-xl cursor-pointer transition-all ${isCurrent ? 'bg-white/20' : 'hover:bg-white/10'}`;
                    const durationStr = song.duration ? formatTime(song.duration) : 'Full';
                    li.innerHTML = `
                        <div class="relative flex-shrink-0">
                            <img src="${song.artwork || 'models/main.png'}" class="w-10 h-10 rounded-lg object-cover"/>
                            <div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-lg opacity-0 hover:opacity-100 transition-opacity">
                                <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M9.5 5.5v13l10-6.5z"/></svg>
                            </div>
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-xs font-semibold text-white truncate">${escapeHtml(song.title)}</p>
                            <p class="text-[10px] text-white/60 truncate">${escapeHtml(song.artist)} · ${DECADE_LABELS[song.decade] || 'Hindi'}</p>
                        </div>
                        <span class="text-[9px] font-medium text-amber-200 bg-amber-950/50 border border-amber-500/20 rounded px-1.5 py-0.5 flex-shrink-0">${durationStr}</span>
                    `;
                    li.addEventListener('click', () => {
                        discoverResults.querySelectorAll('li').forEach(el => el.classList.remove('bg-white/20'));
                        li.classList.add('bg-white/20');
                        playPreviewSong(song, idx);
                    });
                    discoverResults.appendChild(li);
                });

            } catch (err) {
                if (myToken !== discoverSearchToken) return;
                discoverStatus.classList.remove('hidden');
                discoverStatus.textContent = 'Search failed — check your connection.';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        let currentSong = null;
        let currentPreviewList = [];
        let currentPreviewIndex = -1;

        let currentBlobUrl = null;

        function playFromLibrary(libIndex) {
            const song = library[libIndex];
            if (!song || !song.file) return;
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }
            currentLibIndex = libIndex;
            currentSong = song;
            currentBlobUrl = URL.createObjectURL(song.file);
            loadSong(song, currentBlobUrl);
            playSong();
            playPauseBtn.disabled = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            likeBtn.disabled = false;
            updateLikeIcon();
            renderPlaylistPanel();
        }

        function playPreviewSong(song, listIndex) {
            currentLibIndex = null;
            currentSong = song;
            currentPreviewIndex = (typeof listIndex === 'number') ? listIndex : currentPreviewList.indexOf(song);
            loadSong(song, song.previewUrl, true);
            playSong();
            playPauseBtn.disabled = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            likeBtn.disabled = false;
            updateLikeIcon();
            renderPlaylistPanel();
        }

        function loadSong(song, src, isPreview) {
            // Trigger smooth song change transition animations
            songTitleEl.classList.remove('song-slide-in');
            artistNameEl.classList.remove('song-slide-in');
            albumArt.classList.remove('vinyl-pulse');
            void songTitleEl.offsetWidth; // Force reflow
            songTitleEl.classList.add('song-slide-in');
            artistNameEl.classList.add('song-slide-in');
            albumArt.classList.add('vinyl-pulse');

            songTitleEl.textContent = song.title;
            const badge = (song.isFullSong !== false) ? ' · Full Song' : ' · 30s preview';
            artistNameEl.textContent = song.artist + ' · ' + (DECADE_LABELS[song.decade] || song.decade) + badge;
            audioElement.src = src;
            if (song.artwork) {
                albumArt.src = song.artwork;
            }
            albumArt.classList.add('paused-art');
        }

        function playSong() {
            audioElement.play().then(() => {
                isPlaying = true;
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                albumArt.classList.remove('paused-art');
            }).catch(err => {
                console.log("Playback prevented:", err);
                isPlaying = false;
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                // Show user-friendly prompt instead of silent failure
                if (currentSong) {
                    artistNameEl.textContent = 'Tap ▶ to play · ' + (currentSong.artist || '');
                }
            });
        }

        function pauseSong() {
            audioElement.pause();
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            albumArt.classList.add('paused-art');
        }

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) pauseSong(); else playSong();
        });

        const hiddenDietCoke = document.getElementById('hiddenDietCoke');
        
        function updateHotspotPosition() {
            if (!hiddenDietCoke) return;
            const W = window.innerWidth;
            const H = window.innerHeight;
            const W0 = 1536;
            const H0 = 1024;
            const S = Math.max(W / W0, H / H0);
            const X_offset = (W - (W0 * S)) / 2;
            const Y_offset = (H - (H0 * S)) / 2;
            
            // Exact coordinates of Diet Coke can in 1536x1024 artwork
            const X0 = 76;
            const Y0 = 572;
            const canW = Math.max(32, Math.round(26 * S));
            const canH = Math.max(46, Math.round(42 * S));
            
            const left = Math.round(X_offset + (X0 * S) - 4);
            const top = Math.round(Y_offset + (Y0 * S) - 2);
            
            hiddenDietCoke.style.left = `${left}px`;
            hiddenDietCoke.style.top = `${top}px`;
            hiddenDietCoke.style.width = `${canW + 8}px`;
            hiddenDietCoke.style.height = `${canH + 8}px`;
        }

        window.addEventListener('resize', updateHotspotPosition, { passive: true });
        window.addEventListener('orientationchange', updateHotspotPosition, { passive: true });
        updateHotspotPosition();

        if (hiddenDietCoke) {
            let easterEggLastFired = 0;
            const triggerEasterEgg = async (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                // Debounce: prevent double-fire from touchend + click on mobile
                const now = Date.now();
                if (now - easterEggLastFired < 500) return;
                easterEggLastFired = now;

                // Default full-track stream fallback for instant touch playback
                let song = {
                    id: 'bubblegum-princess',
                    title: 'Bubblegum Princess',
                    artist: 'Diet Coke Special · ilyTOMMY',
                    decade: '20s',
                    artwork: 'models/diet_coke.png',
                    previewUrl: 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/2f/f6/49/2ff6494e-ebad-85a7-2b76-d0925cf4f6a1/mzaf_3783394280351668694.plus.aac.p.m4a',
                    duration: 95,
                    isFullSong: true,
                    liked: likedPreviews.some(s => s.id === 'bubblegum-princess')
                };

                // Trigger playback synchronously within the user gesture loop
                currentPreviewList = [song];
                playPreviewSong(song, 0);

                // Fetch full-length stream URL from JioSaavn in background to upgrade to full song
                try {
                    const fullTracks = await fetchFullSongs('Princess Bubblegum ilyTOMMY');
                    if (fullTracks && fullTracks.length > 0) {
                        const full = fullTracks[0];
                        song.previewUrl = full.previewUrl;
                        song.title = 'Bubblegum Princess';
                        song.artist = 'ilyTOMMY · Full Song';
                        song.duration = full.duration || 95;
                        if (full.artwork) song.artwork = full.artwork;
                        if (currentSong && currentSong.id === 'bubblegum-princess') {
                            audioElement.src = full.previewUrl;
                            audioElement.play().catch(() => {});
                            artistNameEl.textContent = song.artist + " · 2020's · Full Song";
                        }
                    }
                } catch (_) {}
            };

            hiddenDietCoke.addEventListener('click', triggerEasterEgg);
            hiddenDietCoke.addEventListener('touchend', triggerEasterEgg, { passive: false });
        }

        document.addEventListener('keydown', (e) => {
            const tag = (e.target && e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;

            switch (e.code) {
                case 'Enter':
                    e.preventDefault();
                    playRandomDiceSong();
                    break;
                case 'Space':
                    e.preventDefault();
                    if (isPlaying) pauseSong(); else playSong();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    prevBtn.click();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextBtn.click();
                    break;
            }
        });

        function currentPositionInFilter() {
            return filteredView.indexOf(currentLibIndex);
        }

        nextBtn.addEventListener('click', () => {
           
            if (currentLibIndex !== null) {
                const pool = filteredView.length ? filteredView : library.map((_, i) => i);
                if (pool.length <= 1) { if (pool.length === 1) playFromLibrary(pool[0]); return; }
                let pos = pool.indexOf(currentLibIndex);
                pos = (pos + 1 + pool.length) % pool.length;
                playFromLibrary(pool[pos]);
                return;
            }
            if (currentPreviewList.length > 1) {
                const pos = (currentPreviewIndex + 1) % currentPreviewList.length;
                playPreviewSong(currentPreviewList[pos], pos);
                return;
            }
            if (diceHistoryPos < diceHistory.length - 1) {
                diceHistoryPos++;
                const song = diceHistory[diceHistoryPos];
                currentPreviewList = [song];
                playPreviewSong(song, 0);
            } else {
                playRandomDiceSong();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentLibIndex !== null) {
                const pool = filteredView.length ? filteredView : library.map((_, i) => i);
                if (pool.length <= 1) { if (pool.length === 1) playFromLibrary(pool[0]); return; }
                let pos = pool.indexOf(currentLibIndex);
                pos = (pos - 1 + pool.length) % pool.length;
                playFromLibrary(pool[pos]);
                return;
            }
            if (currentPreviewList.length > 1) {
                const pos = (currentPreviewIndex - 1 + currentPreviewList.length) % currentPreviewList.length;
                playPreviewSong(currentPreviewList[pos], pos);
                return;
            }
            if (diceHistoryPos > 0) {
                diceHistoryPos--;
                const song = diceHistory[diceHistoryPos];
                currentPreviewList = [song];
                playPreviewSong(song, 0);
            }
        });

        function triggerHeartBurst() {
            if (!likeBtn) return;
            for (let i = 0; i < 4; i++) {
                const burst = document.createElement('span');
                burst.className = 'heart-burst text-pink-400 font-bold';
                burst.textContent = '♥';
                const angle = (i / 4) * Math.PI * 2 + (Math.random() * 0.4 - 0.2);
                const dist = 12 + Math.random() * 10;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;
                burst.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`;
                likeBtn.appendChild(burst);
                setTimeout(() => burst.remove(), 550);
            }
        }

        likeBtn.addEventListener('click', () => {
            if (!currentSong) return;
            if (currentSong.previewUrl) {
                const idx = likedPreviews.findIndex(s => s.id === currentSong.id);
                if (idx >= 0) {
                    likedPreviews.splice(idx, 1);
                    currentSong.liked = false;
                } else {
                    likedPreviews.push({ ...currentSong });
                    currentSong.liked = true;
                    triggerHeartBurst();
                }
                saveLikedPreviews(likedPreviews);
            } else {
                currentSong.liked = !currentSong.liked;
                if (currentSong.liked) {
                    likedIds.add(currentSong.id);
                    triggerHeartBurst();
                } else {
                    likedIds.delete(currentSong.id);
                }
                saveLikedIds(likedIds);
            }
            updateLikeIcon();
            renderPlaylistPanel();
        });

        function updateLikeIcon() {
            if (!currentSong) {
                likeIcon.setAttribute('fill', 'none');
                return;
            }
            if (currentSong.liked) {
                likeIcon.setAttribute('fill', 'currentColor');
                likeBtn.classList.add('text-pink-400');
                likeBtn.classList.remove('text-white/70');
            } else {
                likeIcon.setAttribute('fill', 'none');
                likeBtn.classList.remove('text-pink-400');
                likeBtn.classList.add('text-white/70');
            }
        }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration && !isScrubbing) {
                const current = audioElement.currentTime;
                const percent = (current / audioElement.duration) * 100;
                progressBar.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(current);
            }
        });

        audioElement.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioElement.duration || 0);
        });

        audioElement.addEventListener('error', () => {
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            albumArt.classList.add('paused-art');
            songTitleEl.textContent = '⚠ Stream error';
            artistNameEl.textContent = 'Skipping to next song…';
            // Auto-skip to next song after a short delay
            setTimeout(() => nextBtn.click(), 2000);
        });

        audioElement.addEventListener('ended', () => {
            if (currentLibIndex !== null) {
                nextBtn.click();
            } else if (currentPreviewList.length > 1) {
                const nextIndex = currentPreviewIndex + 1;
                if (nextIndex < currentPreviewList.length) {
                    playPreviewSong(currentPreviewList[nextIndex], nextIndex);
                } else {
                    playRandomDiceSong();
                }
            } else {
                playRandomDiceSong();
            }
        });

        let isScrubbing = false;

        function seekTo(clientX) {
            if (!audioElement.duration) return NaN;
            const rect = progressBarContainer.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const percentage = Math.min(Math.max(clickX / rect.width, 0), 1);
            progressBar.style.width = `${percentage * 100}%`;
            currentTimeEl.textContent = formatTime(percentage * audioElement.duration);
            return percentage * audioElement.duration;
        }

        progressBarContainer.addEventListener('mousedown', (e) => {
            if (!audioElement.duration) return;
            isScrubbing = true;
            progressBarContainer.classList.add('scrubbing');
            seekTo(e.clientX);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isScrubbing) return;
            seekTo(e.clientX);
        });

        window.addEventListener('mouseup', (e) => {
            if (!isScrubbing) return;
            isScrubbing = false;
            progressBarContainer.classList.remove('scrubbing');
            const targetTime = seekTo(e.clientX);
            if (isFinite(targetTime)) audioElement.currentTime = targetTime;
        });

        progressBarContainer.addEventListener('touchstart', (e) => {
            if (!audioElement.duration || !e.touches.length) return;
            isScrubbing = true;
            progressBarContainer.classList.add('scrubbing');
            seekTo(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isScrubbing || !e.touches.length) return;
            seekTo(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isScrubbing) return;
            isScrubbing = false;
            progressBarContainer.classList.remove('scrubbing');
            if (e.changedTouches.length) {
                const targetTime = seekTo(e.changedTouches[0].clientX);
                if (isFinite(targetTime)) audioElement.currentTime = targetTime;
            }
        });

        function showShortcutToast() {
            if (window.innerWidth < 768) return;
            if (localStorage.getItem('sawBonfireShortcuts')) return;
            localStorage.setItem('sawBonfireShortcuts', '1');
            
            const toast = document.createElement('div');
            toast.className = 'shortcut-toast mac-glass px-3.5 py-1.5 rounded-full text-[11px] text-white/80 flex items-center gap-2 shadow-2xl border border-white/20 select-none';
            toast.innerHTML = `<span class="text-amber-300">⌨</span> <span><b>Enter</b> Random</span> · <span><b>Space</b> Play/Pause</span> · <span><b>← →</b> Prev/Next</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5200);
        }
        setTimeout(showShortcutToast, 1500);

        function formatTime(seconds) {
            if (!isFinite(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
